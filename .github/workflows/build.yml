name: Build assets

# styles.css is generated from the classes used in index.html, and it is what
# GitHub Pages actually serves. The failure mode this guards against is silent:
# someone adds a Tailwind class to index.html, forgets `npm run build:css`, and
# that class simply has no styles in production — no error, just a broken
# layout for users. So rebuild here and fail if the committed file is stale.

on:
  push:
    paths: ["index.html", "app.js", "tailwind.config.js", "src.css", "styles.css", "vendor/**", "build.js", "sim.js", "_headers", "package.json", ".github/workflows/build.yml"]
  pull_request:
    paths: ["index.html", "app.js", "tailwind.config.js", "src.css", "styles.css", "vendor/**", "build.js", "_headers", "package.json"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run build:css
      - name: styles.css must match index.html
        run: |
          if ! git diff --quiet -- styles.css; then
            echo "::error::styles.css is out of date. Run 'npm run build:css' and commit the result."
            git diff --stat -- styles.css
            exit 1
          fi
          echo "styles.css is up to date."
      - run: npm run vendor:supabase
      - name: vendor/supabase.js must match the pinned version
        run: |
          if ! git diff --quiet -- vendor/supabase.js; then
            echo "::error::vendor/supabase.js differs from the pinned package. Run 'npm run vendor:supabase' and commit."
            exit 1
          fi
          echo "vendored Supabase client matches package.json."
      - name: Assemble the deployable site
        # build.js fails on external assets, an inline <script> (either would
        # silently defeat the CSP in _headers), or any trace of the dev-only
        # simulator reaching a production bundle.
        run: npm run bundle
      - name: Logic tests
        run: node test_logic.js

      # schema.sql and rls.sql against a real engine. The two worst regressions
      # this repo has had were both invisible to the logic suite: a schema.sql
      # re-run silently undoing the RLS lockdown, and `rounds` ending up with
      # RLS on and no policy so settlement was refused in silence. Ubuntu
      # runners ship Postgres, so this needs no service container.
      - name: SQL tests (schema.sql + rls.sql on real Postgres)
        run: bash test_sql.sh

      # Does the assembled site actually start? The logic suite loads app.js
      # into a stub DOM, so it cannot see a script that 404s, a CSP that blocks
      # something, or a stylesheet whose classes were purged. Runs against
      # public/, i.e. what gets deployed.
      - name: Install Chromium for the browser harness
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
