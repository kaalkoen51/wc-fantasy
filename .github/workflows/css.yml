name: Build assets

# styles.css is generated from the classes used in index.html, and it is what
# GitHub Pages actually serves. The failure mode this guards against is silent:
# someone adds a Tailwind class to index.html, forgets `npm run build:css`, and
# that class simply has no styles in production — no error, just a broken
# layout for users. So rebuild here and fail if the committed file is stale.

on:
  push:
    paths: ["index.html", "tailwind.config.js", "src.css", "styles.css", "vendor/**", "package.json", ".github/workflows/css.yml"]
  pull_request:
    paths: ["index.html", "tailwind.config.js", "src.css", "styles.css", "vendor/**", "package.json"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run build:css
      - name: styles.css must match index.html
        run: |
          if ! git diff --quiet -- styles.css; then
            echo "::error::styles.css is out of date. Run 'npm run build:css' and commit the result."
            git diff --stat -- styles.css
            exit 1
          fi
          echo "styles.css is up to date."
      - run: npm run vendor:supabase
      - name: vendor/supabase.js must match the pinned version
        run: |
          if ! git diff --quiet -- vendor/supabase.js; then
            echo "::error::vendor/supabase.js differs from the pinned package. Run 'npm run vendor:supabase' and commit."
            exit 1
          fi
          echo "vendored Supabase client matches package.json."
      - name: No third-party assets in the critical path
        run: |
          if grep -nE '<(script|link)[^>]+(src|href)="https?://' index.html; then
            echo "::error::index.html loads an external asset. Vendor it instead."
            exit 1
          fi
          echo "index.html loads only same-origin assets."
      - name: Logic tests
        run: node test_logic.js
