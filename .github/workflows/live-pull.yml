name: Live stats pull

# Watchdog. GENERATED by build_schedule.py — edit that script, not the cron
# list below — from the static World Cup calendar in fixtures.json PLUS a
# fixed baseline covering the hours European club football is played. The
# baseline is why this list is long: fixtures.json is an evening tournament,
# so on its own it left a Premier League Saturday afternoon unwatched.
# Each run exits in seconds when nothing is live or imminent;
# otherwise live_pull.py stays alive (--max-wait), polling every 5 minutes
# until the day's matches end. The concurrency group stops triggers from
# stacking while a loop is running. The daily + same-day catch-up sweeps
# remain the authoritative reconciliation.
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "25 0 * * *"
    - cron: "40 0 * * *"
    - cron: "55 0 * * *"
    - cron: "10 1 * * *"
    - cron: "25 1 * * *"
    - cron: "40 1 * * *"
    - cron: "55 1 * * *"
    - cron: "40 2 * * *"
    - cron: "55 2 * * *"
    - cron: "40 3 * * *"
    - cron: "55 3 * * *"
    - cron: "10 11 * * *"
    - cron: "25 11 * * *"
    - cron: "40 11 * * *"
    - cron: "55 11 * * *"
    - cron: "10 12 * * *"
    - cron: "25 12 * * *"
    - cron: "40 12 * * *"
    - cron: "55 12 * * *"
    - cron: "10 13 * * *"
    - cron: "25 13 * * *"
    - cron: "40 13 * * *"
    - cron: "55 13 * * *"
    - cron: "10 14 * * *"
    - cron: "25 14 * * *"
    - cron: "40 14 * * *"
    - cron: "55 14 * * *"
    - cron: "10 15 * * *"
    - cron: "25 15 * * *"
    - cron: "40 15 * * *"
    - cron: "55 15 * * *"
    - cron: "10 16 * * *"
    - cron: "25 16 * * *"
    - cron: "40 16 * * *"
    - cron: "55 16 * * *"
    - cron: "10 17 * * *"
    - cron: "25 17 * * *"
    - cron: "40 17 * * *"
    - cron: "55 17 * * *"
    - cron: "10 18 * * *"
    - cron: "25 18 * * *"
    - cron: "40 18 * * *"
    - cron: "55 18 * * *"
    - cron: "10 19 * * *"
    - cron: "25 19 * * *"
    - cron: "40 19 * * *"
    - cron: "55 19 * * *"
    - cron: "10 20 * * *"
    - cron: "25 20 * * *"
    - cron: "40 20 * * *"
    - cron: "55 20 * * *"
    - cron: "10 21 * * *"
    - cron: "25 21 * * *"
    - cron: "40 21 * * *"
    - cron: "55 21 * * *"
    - cron: "10 22 * * *"
    - cron: "25 22 * * *"
    - cron: "40 22 * * *"
    - cron: "55 22 * * *"
    - cron: "10 23 * * *"
    - cron: "25 23 * * *"
    - cron: "40 23 * * *"
    - cron: "55 23 * * *"
  workflow_dispatch:

concurrency:
  group: live-pull
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch / pull live stats
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
        run: python live_pull.py
