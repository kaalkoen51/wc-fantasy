# Cloudflare Workers Static Assets.
#
# The site is plain static files -- build.js assembles them into public/ -- so
# this is an ASSETS-ONLY Worker: there is no `main` script, and every request is
# served straight from the edge. That matters for cost as well as simplicity,
# because requests that never invoke a Worker script are not Worker invocations.
#
# Deliberately NOT setting not_found_handling. The app has no path-based routing
# (route() never touches the URL), so nothing needs a catch-all. Turning on
# single-page-application mode would answer a request for a missing
# fixtures.json with index.html and a 200, which the fetch would then fail to
# parse -- a silently empty fixture list instead of an honest 404.
name = "draftbaron"
compatibility_date = "2025-06-01"

# One canonical origin: draftbaron.com and nothing else.
#
# Sessions and auth are per-origin, so every extra hostname the app answers on
# is a hostname that has to be allowlisted in Supabase -- and a user who signed
# in on one and later typed the other would look logged out. Left at their
# defaults, wrangler would also publish draftbaron.<account>.workers.dev and a
# fresh preview URL for every deployment, which for a paid product means every
# version is quietly browsable.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
